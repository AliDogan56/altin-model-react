services:
  api-gateway:
    build: ./backend/api-gateway
    restart: unless-stopped
    environment:
      APP_ENV: production
      MODEL_SERVICE_URL: http://model-service:8002
      MARKET_SERVICE_URL: http://market-service:8001
      DATABASE_PATH: /data/gold_platform_production.sqlite3
      CORS_ORIGINS: http://5.75.148.203
    volumes:
      - gold-data:/data
    networks: [gold-network]
    depends_on:
      market-service:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  market-service:
    build: ./backend/market-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/gold_platform_production.sqlite3
      CORS_ORIGINS: http://api-gateway:8000
    volumes:
      - gold-data:/data
    networks: [gold-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  model-service:
    build: ./backend/model-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/gold_platform_production.sqlite3
      MODEL_DIR: /models
      GATEWAY_URL: http://api-gateway:8000
      CORS_ORIGINS: http://api-gateway:8000
      AUTO_TRAIN: "true"
    volumes:
      - gold-data:/data
      - gold-models:/models
    networks: [gold-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [gold-network]
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  gold-network:
    driver: bridge

volumes:
  gold-data:
  gold-models:
