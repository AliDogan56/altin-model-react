# Guvenlik basliklari. Her `add_header` tanimlayan blokta `include` edilir;
# nginx'te bir location kendi add_header'ini yazinca ust bloktakiler **ezilir**.
#
# CSP notlari:
# - script-src: yalniz kendi paketlerimiz + index.html'deki satir ici tema betigi
#   (hash ile). Betik degisirse hash de degismeli; `src/app/csp.test.ts` bunu
#   dogrular, yoksa tema betigi sessizce engellenir ve koyu tema bir kare gec kalir.
# - style-src 'unsafe-inline': React `style={{width}}` gibi nitelik stilleri
#   kullaniyor (ilerleme cubuklari, grafik); CSP3 nitelikleri hash'le kapsamiyor.
# - connect-src: API ayni origin; canli fiyat Harem Socket.IO'dan (websocket).
# - frame-ancestors 'none': site hicbir yerde iframe icinde gosterilmez
#   (tiklama tuzagi korumasi); eski tarayicilar icin X-Frame-Options da var.
# HSTS, nosniff ve referrer-policy host nginx'te (deploy/nginx/); burada
# tekrarlanirsa baslik iki kez gider.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-i60YQy5un6QtZXm9+1lr1hCs01UU+yTgPdqRsdq3Zf8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://hrmsocketonly.haremaltin.com https://hrmsocketonly.haremaltin.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
