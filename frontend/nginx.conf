server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/rehber/(canli-ons-altin-fiyati|ons-altin-tahmini|altin-fiyatini-etkileyen-faktorler|reel-faiz-altin-iliskisi|dolar-endeksi-altin|enflasyon-fed-altin|altin-destek-direnc|paxg-usdt-nedir|xauusd-nedir|yapay-zeka-altin-tahmini)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/rehber/ {
        return 404;
    }

    location ~ ^/(market-service|model-service)(/|$) {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
