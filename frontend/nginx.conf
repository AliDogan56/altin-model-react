# Hiz siniri bolgeleri. `conf.d/*.conf` nginx tarafindan `http` baglamina dahil
# edildigi icin bu direktifler burada gecerlidir.
#
# Esikler cömert secildi ve sebebi olculdu: trafigin %76'si mobil ve Turkiye'de
# mobil kullanicilarin buyuk kismi **operator NAT'i** arkasinda, yani cok sayida
# gercek kullanici tek IP paylasiyor. Dar bir IP basina sinir once gercek
# kullaniciyi keserdi. Amac betikle suregen yuk bindirmeyi kesmek, tarayiciyi
# yavaslatmak degil: bir sayfa acilisi ~6 API istegi yapiyor, vade degistirmek
# birkac `/v1/predict` daha ekliyor.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;

    # Gercek istemci IP'si. Konteynere yalniz host nginx ulasir (web 127.0.0.1:8080'e
    # bagli) ve o `X-Real-IP` gonderir. Bu olmadan `$binary_remote_addr` her istek
    # icin docker ag gecidi (172.18.0.1) olur ve hiz siniri kisi basina degil
    # **site geneli** uygulanir — canlida olculdu (2026-09-03). Yalniz docker
    # ozel araligindan gelen baslığa guvenilir; X-Forwarded-For degil X-Real-IP
    # kullanilir cunku tek deger tasir, zincir uzerinden sahtelenemez.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Proxy arkasinda oldugumuz icin nginx dizin yonlendirmesini http:// olarak uretiyordu;
    # goreli yonlendirme protokol dusmesini onler.
    absolute_redirect off;

    # Sikistirma bu katmanda yapilir. Host nginx'te `gzip on;` vardi ama
    # `gzip_types` yorumdaydi ve nginx varsayilani yalniz text/html oldugu icin
    # JS ve CSS ham gidiyordu (olculdu: JS 759,8 KB, CSS 72,4 KB, ikisi de
    # Content-Encoding'siz). Burada olmasinin sebebi: statik dosyalarin sahibi
    # bu katman ve bu dosya depoda surumleniyor; host yapilandirmasi repoya
    # bagli degil, sunucu yeniden kurulursa oradaki duzeltme kaybolurdu.
    # Host nginx zaten sikistirilmis yaniti oldugu gibi gecirir; nginx
    # Content-Encoding tasiyan bir yaniti yeniden sikistirmaz.
    gzip on;
    gzip_vary on;              # ayni URL'in ham/sikistirilmis surumleri ayri onbelleklensin
    gzip_comp_level 6;         # boyut/CPU dengesi; 9 yalniz %1-2 kazandirip CPU'yu katlar
    gzip_min_length 1024;      # kucuk dosyada sikistirma kazanc saglamaz
    gzip_proxied any;          # proxy arkasindayiz
    # text/html nginx'te her zaman dahildir, listelenmez.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Onbellek politikasi uc kademeli:
    #   1) varsayilan (bu satir)  : HTML, sitemap, robots ve API  -> her zaman dogrula
    #   2) /assets/               : dosya adi hash'li             -> bir yil, immutable
    #   3) hash'siz gorsel/font   : nadiren degisir               -> bir hafta
    # `add_header` bir location'da tanimlanirsa ust bloktan gelenleri **ezer**;
    # bu yuzden her kademe kendi basligini eksiksiz yazar.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;

    location = /404.html {
        internal;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # Dosya adlari icerik hash'i tasiyor (index-<hash>.js): icerik degisirse ad da
    # degisir, o yuzden tarayici eski surumu sonsuza kadar saklayabilir.
    # `immutable` ile tarayici sayfa yenilense bile yeniden dogrulama istegi atmaz.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Hash'siz statik varlik (favicon, sosyal onizleme): nadiren degisir ama
    # adi sabit, o yuzden sonsuz degil bir haftalik onbellek.
    # `^~ /assets/` regex'ten once degerlendirildigi icin oradaki dosyalar
    # bu kurala dusmez.
    location ~* \.(?:svg|png|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Kaldirilan icerik: PAXG kaynagi projeden cikarilinca makale de silindi, ama URL
    # Google'in hafizasinda kaldi ve Coverage raporunda "Bulunamadi (404)" olarak
    # gorunuyordu. 404 birakmak birikmis sinyali cope atar; konu olarak en yakin
    # sayfaya kalici yonlendirme yapiyoruz. `^~` ile eslesme, alttaki /rehber/
    # kuralindan once degerlendirilsin diye tam eslesme (=) kullanildi.
    location = /rehber/paxg-usdt-nedir {
        return 301 /rehber/fiziki-altin-mi-dijital-altin-mi;
    }

    # Birlestirilen icerik: ayni gram cevrimi konusunu ucu birden anlatiyordu ve
    # Google birini secip digerlerini elemisti (Coverage: biri "tarandi, dizine
    # eklenmedi", digeri "kesfedildi, taranmadi"). Ozgun kalan icerik hayatta
    # kalan sayfaya tasindi, iki URL kalici olarak oraya yonlendirildi.
    location = /rehber/bir-ons-altin-kac-gram {
        return 301 /rehber/ons-gram-altin-hesaplama;
    }

    location = /rehber/gram-altin-fiyati-nasil-belirlenir {
        return 301 /rehber/ons-gram-altin-hesaplama;
    }

    # /panel/<slug> özellik sayfaları. /rehber ile aynı mantık: sondaki eğik çizgisiz
    # yol da doğrudan 200 dönmeli, sitemap ve canonical o biçimde yazılıyor.
    location = /panel {
        try_files /panel/index.html =404;
    }

    location ^~ /panel/ {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # /rehber dizin sayfası. `location ^~ /rehber/` sondaki eğik çizgisiz yolu
    # yakalamaz; buradan gelmezse `location /` üzerinden 301 ile /rehber/ adresine
    # yönlenirdi. Sitemap ve canonical /rehber olduğu için doğrudan 200 dönmeli.
    location = /rehber {
        try_files /rehber/index.html =404;
    }

    location ^~ /rehber/ {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # /yorum: dizine açık günlük yorum sayfası (2026-09-15). Kabuk derlemede üretilir
    # (dist/yorum/index.html); içerik her istekte yorum servisinden SSI ile eklenir:
    # <head> parçası (açıklama, paylaşım etiketleri, Article şeması) ve gövde parçası
    # (makale + React'in hidrasyonda okuduğu JSON). Google JavaScript çalıştırmadan
    # o anki metni görür; metin 1-4 saatte bir değiştiği için derleme anındaki ön
    # render işe yaramazdı. `ssi_silent_errors`: servis düşerse hata metni değil boş
    # parça basılır; başlık ve canonical kabukta olduğu için sayfa başlıksız kalmaz.
    location = /yorum {
        ssi on;
        ssi_silent_errors on;
        try_files /yorum/index.html =404;
    }

    location = /yorum/ {
        return 301 /yorum;
    }

    # SSI alt istekleri. `internal`: dışarıdan çağrılamaz (404). Hız sınırı yok
    # (alt istek zaten limit_req'ten geçmez); sıkıştırılmamış gövde istenir, SSI
    # gzip'li gövdeyi olduğu gibi yapıştırırdı. /_yorum/head -> .../latest/page/head
    location ^~ /_yorum/ {
        internal;
        proxy_pass http://api-gateway:8000/commentary-service/v1/commentary/latest/page/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Sitemap'te /yorum girdisinin <lastmod> değeri de SSI ile canlı yazılır; XML
    # SSI'ye açılır (varsayılan ssi_types yalnız text/html).
    location = /sitemap.xml {
        ssi on;
        ssi_silent_errors on;
        ssi_types application/xml;
        try_files $uri =404;
    }

    # Kurumsal sayfalar: her biri kendi klasöründe ön render edilmiş index.html.
    location ~ ^/(hakkimizda|yazar|iletisim|gizlilik)$ {
        try_files /$1/index.html =404;
    }

    location ~ ^/(market-service|model-service|commentary-service)(/|$) {
        # burst: ani yigilmaya izin verilir (sayfa acilisi, vade degistirme),
        # nodelay: burst icindeki istekler kuyruga alinmaz, hemen gecer.
        # Sinir asilinca 429 doner; arayuz bozuk yanit alirsa notr yedege duser.
        limit_req zone=api_rate burst=40 nodelay;
        limit_conn api_conn 20;
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
