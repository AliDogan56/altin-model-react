<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#07111f" />
    <title>Sayfa Bulunamadı | Ons Altın Analiz</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef5fb;background:#07111f;color-scheme:dark}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 50% 0,#3d31194a,transparent 38%),linear-gradient(145deg,#0b1c2f,#050b14);display:grid;place-items:center;padding:18px}
      main{width:min(100%,680px);padding:clamp(26px,7vw,64px);border:1px solid #29445e;border-radius:24px;background:#0b1929e8;box-shadow:0 24px 70px #0008;text-align:center}
      img{width:58px;height:58px}small{display:block;margin:20px 0 8px;color:#dcbf68;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
      h1{margin:0;font-size:clamp(34px,9vw,68px);line-height:1}p{max-width:510px;margin:18px auto 28px;color:#adc0d2;font-size:clamp(14px,3.8vw,17px);line-height:1.7}
      nav{display:flex;flex-direction:column;gap:10px}a{min-height:48px;padding:14px 18px;border:1px solid #78642f;border-radius:13px;background:#d3ad47;color:#07111f;text-decoration:none;font-size:14px;font-weight:900}
      a+a{background:#0a1726;color:#d8e6f2;border-color:#29445e}@media(min-width:560px){nav{flex-direction:row;justify-content:center}a{min-width:190px}}
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="Ons Altın Analiz" />
      <small>404 · Sayfa bulunamadı</small>
      <h1>Aradığınız sayfa burada değil.</h1>
      <p>Bağlantı değişmiş veya adres yanlış yazılmış olabilir. Canlı ons altın paneline dönebilir ya da güncel analiz rehberlerini inceleyebilirsiniz.</p>
      <nav aria-label="404 sayfası bağlantıları">
        <a href="/">Canlı panele dön</a>
        <a href="/#rehberler">Altın rehberlerini aç</a>
      </nav>
    </main>
  </body>
</html>
